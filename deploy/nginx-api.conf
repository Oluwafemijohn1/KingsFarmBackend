# Install on the VPS at /etc/nginx/sites-available/api.kingfarmsltd.com
# (symlink into sites-enabled), then run: sudo certbot --nginx -d api.kingfarmsltd.com
server {
    listen 80;
    server_name api.kingfarmsltd.com;

    client_max_body_size 10m;

    # Compress text assets/JSON so pages and API responses download faster.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;


    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite (not append) so a client can't spoof its IP to dodge the
        # app's rate limiter, which reads X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
